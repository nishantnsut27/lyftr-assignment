[project]
name = "lyftr-backend"
version = "0.1.0"
description = "Session chat with deterministic LiteLLM key failover and disk caching"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "litellm==1.80.0",
    "openai>=2.8,<3",
    "diskcache>=5.6,<6",
    "pydantic>=2.10,<2.12",
    "pydantic-settings>=2.7,<3",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.11,<1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"app/main.py" = ["B008"]
