services:
  - type: web
    name: lyftr-backend
    runtime: docker
    plan: starter
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    disk:
      name: lyftr-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: LLM_API_KEYS
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: LLM_MODEL
        value: groq/openai/gpt-oss-20b
      - key: DATABASE_URL
        value: sqlite:////data/app.db
      - key: LLM_CACHE_DIR
        value: /data/llm-cache
      - key: ENABLE_FAILURE_SIMULATION
        value: "true"
      - key: DEFAULT_SYSTEM_PROMPT
        value: You are a helpful assistant. Answer clearly and concisely.
      - key: LLM_TIMEOUT_SECONDS
        value: "30"
      - key: LLM_MAX_TOKENS
        value: "1024"
      - key: PORT
        value: "8000"
